version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: container-assessment/Dockerfile
    container_name: muchtodo-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongo:27017/much_todo_db
      - DB_NAME=much_todo_db
      - JWT_SECRET_KEY=your-super-secret-key-that-is-long-and-random
      - JWT_EXPIRATION_HOURS=72
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=json
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:4.4
    container_name: muchtodo-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo --quiet --eval "db.runCommand({ping:1})"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo_data:
